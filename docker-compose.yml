services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${DEMO_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/baiyar-for-woocommerce:/var/www/html/wp-content/plugins/baiyar-for-woocommerce

  # One-shot provisioner: `docker compose run --rm wpcli bash /setup/setup.sh` installs WordPress,
  # WooCommerce, the Storefront theme, this plugin, and sample products with a working cart/checkout.
  # Not a long-running service (no `up -d` target), kept in the default compose file so one command sets
  # up the whole demo.
  wpcli:
    image: wordpress:cli-php8.2
    # wordpress:apache (Debian) and wordpress:cli (Alpine) use different uids for www-data (33 vs 82);
    # pin to the apache image's uid so this container can write into the shared wp_data volume.
    user: "33:33"
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/baiyar-for-woocommerce:/var/www/html/wp-content/plugins/baiyar-for-woocommerce
      - ./bin:/setup

volumes:
  db_data:
  wp_data:
